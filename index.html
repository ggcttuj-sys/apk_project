<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آياز</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* قسم الفيديو العلوي */
        .hero-section {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 250px;
            overflow: hidden;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
        }

        /* الفيديو الشغال بالخلفية */
        .hero-section video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* طبقة الدمج السوداء المظلمة */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.98) 100%);
        }

        /* شارة LIVE بالزاوية */
        .live-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(15, 15, 15, 0.85);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 2;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: #ff3b30;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3b30;
        }
