<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1f1f1f;
            color: #fff;
        }
        .container {
            position: relative;
            width: 400px;
            height: 440px;
            background: #252525;
            border: 2px solid #ff416c;
            border-radius: 10px;
            overflow: hidden;
        }
        .form-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .form-box .animation {
            transform: translateX(0);
            opacity: 1;
            filter: blur(0);
            transition: 0.7s ease;
            transition-delay: calc(0.1s * var(--i));
        }
        .container.active .form-box .animation {
            transform: translateX(120%);
            opacity: 0;
            filter: blur(10px);
        }
        .input-box {
            position: relative;
            margin: 15px 0;
        }
        .input-box input {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #fff;
            outline: none;
            color: #fff;
        }
        .btn {
            width: 100%;
            height: 45px;
            background: #ff416c;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            color: #fff;
            font-weight: 600;
        }
        .logreg-link {
            font-size: 14.5px;
            text-align: center;
            margin-top: 20px;
        }
        .logreg-link a {
            color: #ff416c;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container" id="container">
        <div class="form-box login">
            <h2 class="animation" style="--i: 0;">تسجيل الدخول</h2>
            <div class="input-box animation" style="--i: 1;">
                <input type="text" required>
                <label>اسم المستخدم</label>
            </div>
            <div class="input-box animation" style="--i: 2;">
                <input type="password" required>
                <label>كلمة المرور</label>
            </div>
            <button type="submit" class="btn animation" style="--i: 3;">دخول</button>
            
            <div class="logreg-link animation" style="--i: 4;">
                <p>ليس لديك حساب؟ <a href="#" id="register-link">إنشاء حساب</a></p>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const registerLink = document.getElementById('register-link');

        registerLink.addEventListener('click', (e) => {
            e.preventDefault();
            container.classList.toggle('active');
        });
    </script>
</body>
</html>
